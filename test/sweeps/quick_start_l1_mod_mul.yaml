sweep:
  bitwidth: [254]
  tech_type: [gf12_highperf]
  period: [1.0]
  ii: [1]
  mul_type: [mul_nor]
  dep_period_ratio: [1.0]

  base_mul_width:
    64: [16]
    253: [63]
    254: [63]
    256: [64]
    377: [47]
    448: [56]
    511: [63]
    512: [64]
  kar_base_mul_width:
    64: [32, 16]
    253: [126, 63]
    254: [127]
    256: [128, 64]
    377: [188, 94, 47]
    448: [224, 112, 56]
    511: [255, 127, 63]
    512: [256, 128, 64]

  # fixed bakes the constant into the hardware, var takes it as a port
  q_type: [fixed_q]
  rc_type: [var_rc]

  # Which modular reduction the multiply uses
  mred: [mred_mont]

  # field; a named field sets the bitwidth
  field: [bn254_base]

flags:
  num_test_samples: 100
  syn_sel: all            # all, pareto, small_fast (smallest and fastest)
  bb_syn_metrics: false   # blackbox children with their DC area/delay, not Catapult's estimate
  syn_passes: 1           # compile_ultra passes: one full, the rest incremental
