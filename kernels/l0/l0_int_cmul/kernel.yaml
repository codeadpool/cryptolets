# Deps to reuse as packaged RTL. The rest are inlined.
blackbox: []

# The parameters that change the hardware, which name a design's build directory
design_key: [bitwidth, tech_type, period, io_delay, ii, cmul_const, cmul_const_w,
             cmul_hamming, cmul_output_type]

# Of those, the ones that decide what this computes, so only designs that
# could replace one another are compared
kernel_key: [bitwidth, cmul_const, cmul_const_w, cmul_hamming, cmul_output_type]

# Always built as one combinational block. Catapult's latency check rates the
# constant multiply as a generic multiply and would split it over cycles;
# DC decides whether it fits.
force_combinational: true

# Kernel specific Catapult state scripts
states:
  # simple_one_adder keeps the constant multiply as one multiply, which DC
  # maps to DesignWare. The default adder cluster takes DC hours at 381 bits.
  compile: |
    directive set -PIPELINE_INIT_INTERVAL $ii
    directive set -OPT_CONST_MULTS simple_one_adder
